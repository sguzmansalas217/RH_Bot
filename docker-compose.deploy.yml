# Despliegue simple en un Droplet SIN dominio (acceso por IP).
# La app sirve el panel + API en el puerto 80. La BD NO se expone al exterior.
# Uso:  docker compose -f docker-compose.deploy.yml up -d

services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin 'ports': la BD solo es accesible dentro de la red de Docker (más seguro).

  app:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro de Docker, la BD se llama 'db' y usa el puerto interno 5432
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3000"
    volumes:
      - ./backend/.baileys_auth:/app/.baileys_auth   # sesión de WhatsApp (persistente)
      - ./backend/uploads:/app/uploads               # comprobantes subidos
      - ./frontend/dist:/frontend/dist:ro            # panel Vue compilado
    expose:
      - "3000"   # solo dentro de la red de Docker; Caddy la publica por HTTPS

  # Proxy con HTTPS automático (Let's Encrypt). Publica el dominio en 443
  # y redirige el puerto 80 a 443. Renueva el certificado solo.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
