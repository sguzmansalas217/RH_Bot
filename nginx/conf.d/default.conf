# HTTP: valida Certbot y redirige a HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: sirve el panel Vue y hace proxy del API al backend Node
server {
    listen 443 ssl;
    server_name _;

    # Reemplaza rh.tudominio.com por tu dominio antes de emitir el certificado
    ssl_certificate     /etc/letsencrypt/live/rh.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rh.tudominio.com/privkey.pem;

    client_max_body_size 20M;   # comprobantes de incapacidad / archivos
    root /usr/share/nginx/html; # panel Vue compilado (frontend/dist)
    index index.html;

    # API REST
    location /api/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Archivos subidos
    location /uploads/ {
        proxy_pass http://app:3000;
    }

    # Webhook Cloud API (si se usa ese canal)
    location /webhook {
        proxy_pass http://app:3000;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
